<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scale Locked Keyboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
[hidden] { display: none !important; }

/* Layout: a control bar on top, a strip naming the notes in the key, then the keys filling the rest of the screen.
   Keys are stacked in rows, one octave per row, highest pitch on top. */
:root {
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --bg: #ECEFF3;
  --panel: #FFFFFF;
  --ink: #12171D;
  --muted: #566370;
  --line: #C9D1D9;
  --key: #FFFFFF;
  --key-edge: #B4BFCA;
  --accent: #0B7F6F;
  --accent-ink: #FFFFFF;
  --tonic: #D3EEE8;
  --tonic-edge: #0B7F6F;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1216;
    --panel: #171D23;
    --ink: #E9EEF2;
    --muted: #93A0AC;
    --line: #2A333C;
    --key: #1F272F;
    --key-edge: #364350;
    --accent: #3FD0B8;
    --accent-ink: #06211C;
    --tonic: #17403A;
    --tonic-edge: #3FD0B8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1216;
  --panel: #171D23;
  --ink: #E9EEF2;
  --muted: #93A0AC;
  --line: #2A333C;
  --key: #1F272F;
  --key-edge: #364350;
  --accent: #3FD0B8;
  --accent-ink: #06211C;
  --tonic: #17403A;
  --tonic-edge: #3FD0B8;
  color-scheme: dark;
}

html, body { height: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 var(--font-body);
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.app { min-height: 100%; display: flex; flex-direction: column; gap: 14px; max-width: 1200px; margin: 0 auto; }

.top { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; }
.brand { min-width: 0; }
h1 { margin: 0; font: 700 26px/1.1 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }

.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.grow { flex: 1 1 190px; }
.lbl, .field label {
  font: 500 11px/1 var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
select {
  font: 600 17px/1.2 var(--font-body);
  color: var(--ink);
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  min-height: 44px;
  max-width: 100%;
}
.seg { display: flex; border: 2px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; min-height: 44px; }
.seg button {
  font: 600 16px/1 var(--font-body);
  color: var(--ink);
  background: transparent;
  border: 0;
  min-width: 44px;
  padding: 0 12px;
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:hover:not([aria-pressed="true"]) { background: var(--tonic); }
select:focus-visible, .seg button:focus-visible, .key:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }


.stage { flex: 1 1 auto; min-height: 440px; min-width: 0; }
.col { display: flex; flex-direction: column; gap: 8px; height: 100%; min-height: 0; }
.col > .row { flex: 1 1 0; min-height: 60px; }
.col.lined > .row.chords { flex: 0 0 96px; }
.sec { flex: none; font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.rule { flex: none; height: 1px; background: var(--line); margin-block: 2px; }
.row { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.col > .line { flex: 1 1 0; min-height: 150px; }
.line { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
.line .key { flex: 0 0 72px; }

.key {
  --edge: var(--key-edge);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 64px;
  padding: 0;
  font-family: var(--font-display);
  color: var(--ink);
  background: var(--key);
  border: 2px solid var(--edge);
  border-radius: 10px;
  box-shadow: 0 4px 0 var(--edge);
  margin-bottom: 4px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  transition: transform 0.04s, box-shadow 0.04s;
}
.line .key { touch-action: pan-x; margin-bottom: 8px; }
.key.tonic { --edge: var(--tonic-edge); background: var(--tonic); }
.key.down { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); transform: translateY(4px); box-shadow: 0 0 0 var(--edge); }
.key .nm { font-weight: 700; font-size: clamp(18px, 3.4vw, 36px); letter-spacing: -0.01em; pointer-events: none; }
.key .nm sup { font-size: 0.6em; line-height: 0; position: relative; top: -0.35em; vertical-align: baseline; }
.key .deg, .key .kb { position: absolute; font: 500 11px/1 var(--font-mono); opacity: 0.65; pointer-events: none; }
.key .deg { top: 7px; left: 8px; }
.key .kb { bottom: 5px; left: 0; right: 0; text-align: center; text-transform: uppercase; display: none; }
@media (hover: hover) and (pointer: fine) { .key .kb { display: block; } .key { padding-bottom: 18px; } }

@media (prefers-reduced-motion: reduce) { .key { transition: none; } }
@media (max-width: 480px) {
  h1 { font-size: 22px; }
  .row { gap: 5px; }
  .key .deg { top: 5px; left: 5px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Scale Locked Keyboard</h1>
    </div>
    <div class="controls">
      <div class="field grow">
        <label for="keySel">Key</label>
        <select id="keySel"></select>
      </div>
      <div class="field">
        <span class="lbl" id="layLbl">Layout</span>
        <div class="seg" role="group" aria-labelledby="layLbl">
          <button id="layStack" type="button" aria-pressed="true">Rows</button>
          <button id="layLine" type="button" aria-pressed="false">One line</button>
        </div>
      </div>
    </div>
  </header>

  <main class="stage" id="stage"></main>

</div>

<script>
(function () {
  var LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  var NAT = [0, 2, 4, 5, 7, 9, 11];
  var MAJOR = [0, 2, 4, 5, 7, 9, 11];
  var MINOR = [0, 2, 3, 5, 7, 8, 10];
  var FLAT = '♭', SHARP = '♯';

  // [letter index, accidental] in chromatic order starting at C
  var MAJ_TONICS = [[0,0],[1,-1],[1,0],[2,-1],[2,0],[3,0],[3,1],[4,0],[5,-1],[5,0],[6,-1],[6,0]];
  var MIN_TONICS = [[0,0],[0,1],[1,0],[2,-1],[2,0],[3,0],[3,1],[4,0],[4,1],[5,0],[6,-1],[6,0]];

  function accStr(n) { return n === 0 ? '' : n === 1 ? SHARP : n === -1 ? FLAT : n === 2 ? SHARP + SHARP : FLAT + FLAT; }

  var KEYS = [];
  MAJ_TONICS.forEach(function (t) { KEYS.push({ li: t[0], a: t[1], mode: MAJOR, type: 'major' }); });
  MIN_TONICS.forEach(function (t) { KEYS.push({ li: t[0], a: t[1], mode: MINOR, type: 'minor' }); });
  KEYS.forEach(function (k) { k.name = LETTERS[k.li] + accStr(k.a); });

  var KB = [
    ['KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyB', 'KeyN', 'KeyM', 'Comma'],
    ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK'],
    ['KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyT', 'KeyY', 'KeyU', 'KeyI']
  ];
  var KBLABEL = function (code) { return code === 'Comma' ? ',' : code.replace('Key', ''); };
  var CODE2CHORD = {};
  for (var dn = 1; dn <= 8; dn++) CODE2CHORD['Digit' + dn] = dn - 1;
  var CODE2IDX = {};
  KB.forEach(function (row, r) { row.forEach(function (code, c) { CODE2IDX[code] = 7 * r + c; }); });

  var S = { key: 0, layout: 'stack' };
  try {
    var saved = JSON.parse(localStorage.getItem('scalelock') || 'null');
    if (saved) {
      if (saved.key >= 0 && saved.key < KEYS.length) S.key = saved.key;
      if (saved.layout === 'line' || saved.layout === 'stack') S.layout = saved.layout;
    }
  } catch (e) {}
  function save() { try { localStorage.setItem('scalelock', JSON.stringify(S)); } catch (e) {} }

  var keySel = document.getElementById('keySel');
  var stage = document.getElementById('stage');

  function buildOptions() {
    var g1 = document.createElement('optgroup'); g1.label = 'Major keys';
    var g2 = document.createElement('optgroup'); g2.label = 'Minor keys';
    KEYS.forEach(function (k, i) {
      var o = document.createElement('option');
      o.value = String(i);
      o.textContent = k.name + ' ' + k.type;
      (k.type === 'major' ? g1 : g2).appendChild(o);
    });
    keySel.appendChild(g1); keySel.appendChild(g2);
  }

  // 22 notes: three octaves of the scale plus the top key note
  var notes = [];
  function buildNotes() {
    var k = KEYS[S.key];
    var tpc = (NAT[k.li] + k.a + 12) % 12;
    var tmidi = 48 + tpc;
    notes = [];
    for (var i = 0; i < 22; i++) {
      var deg = i % 7, oct = Math.floor(i / 7);
      var midi = tmidi + k.mode[deg] + 12 * oct;
      var letterIdx = (k.li + deg) % 7;
      var n = ((midi % 12 - NAT[letterIdx] + 18) % 12) - 6;
      var octave = Math.floor((midi - n) / 12) - 1;
      notes.push({ idx: i, deg: deg + 1, midi: midi, letter: LETTERS[letterIdx], acc: n, name: LETTERS[letterIdx] + accStr(n), octave: octave });
    }
  }
  function spoken(nt) { return nt.letter + (nt.acc > 0 ? ' sharp' : nt.acc < 0 ? ' flat' : '') + ' ' + nt.octave; }
  function kbCode(idx) { return idx === 21 ? KB[2][7] : KB[Math.floor(idx / 7)][idx % 7]; }

  // Chord n (0 to 7) is the triad built on scale notes n, n+2 and n+4.
  function chordInfo(n) {
    var a = notes[n], b = notes[n + 2], c = notes[n + 4];
    var low = b.midi - a.midi, high = c.midi - b.midi;
    var q = (low === 3 && high === 3) ? 'dim' : (low === 3 ? 'min' : 'maj');
    return { deg: (n % 7) + 1, q: q, idx: [n, n + 2, n + 4] };
  }
  function chordHTML(n) {
    var ch = chordInfo(n);
    var label = ch.deg + (ch.q === 'min' ? 'm' : ch.q === 'dim' ? '<sup>°</sup>' : '');
    var words = ch.q === 'min' ? ' minor' : ch.q === 'dim' ? ' diminished' : ' major';
    return '<button type="button" class="key chord' + (ch.deg === 1 ? ' tonic' : '') + '" data-chord="' + n + '" aria-label="Chord ' + ch.deg + words + '">' +
      '<span class="nm">' + label + '</span>' +
      '<span class="kb">' + (n + 1) + '</span></button>';
  }

  function keyHTML(idx, code) {
    var nt = notes[idx];
    return '<button type="button" class="key' + (nt.deg === 1 ? ' tonic' : '') + '" data-idx="' + idx + '" aria-label="' + spoken(nt) + ', scale degree ' + nt.deg + '">' +
      '<span class="deg">' + nt.deg + '</span>' +
      '<span class="nm">' + nt.name + '</span>' +
      '<span class="kb">' + KBLABEL(code) + '</span></button>';
  }

  function render() {
    stopAll();
    buildNotes();
    var k = KEYS[S.key];
    keySel.value = String(S.key);
    document.getElementById('layStack').setAttribute('aria-pressed', String(S.layout === 'stack'));
    document.getElementById('layLine').setAttribute('aria-pressed', String(S.layout === 'line'));

    var html = '<div class="col' + (S.layout === 'line' ? ' lined' : '') + '">';
    html += '<div class="sec">Chords</div><div class="row chords">';
    for (var n = 0; n < 8; n++) html += chordHTML(n);
    html += '</div><div class="rule"></div><div class="sec">Notes</div>';
    if (S.layout === 'stack') {
      for (var r = 2; r >= 0; r--) {
        html += '<div class="row">';
        for (var c = 0; c < 8; c++) html += keyHTML(7 * r + c, KB[r][c]);
        html += '</div>';
      }
    } else {
      html += '<div class="line">';
      for (var i = 0; i < 22; i++) html += keyHTML(i, kbCode(i));
      html += '</div>';
    }
    html += '</div>';
    stage.innerHTML = html;

  }

  /* ---------- sound ---------- */
  var ctx = null, master = null, noiseBuf = null;
  function ensureCtx() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.4;
      var comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 24; comp.ratio.value = 3;
      comp.attack.value = 0.01; comp.release.value = 0.25;
      master.connect(comp);
      comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return true;
  }

  var SOUND = 'piano'; // 'piano' or 'keys'
  function startVoice(midi, ahead, vol, lite) {
    // Start a little ahead of "now" so the fade-in is always scheduled in the future.
    // Building the voice can take a few milliseconds; without this, a note could start
    // after its own fade-in had already passed, which is heard as a pop.
    var t = ctx.currentTime + ahead;
    var f = 440 * Math.pow(2, (midi - 69) / 12);
    var rel = ctx.createGain(); rel.gain.value = 1; rel.connect(master);
    var env = ctx.createGain(); env.gain.value = 0; env.connect(rel);
    var oscs = [];
    var tau;
    if (SOUND === 'piano') {
      // Struck-string model: slightly stretched partials that fade faster the higher they are,
      // two detuned strings on the lowest partials, and a filter that darkens as the note rings.
      var pf = ctx.createBiquadFilter();
      pf.type = 'lowpass'; pf.Q.value = 0.4;
      pf.frequency.setValueAtTime(Math.min(9000, f * 14), t);
      pf.frequency.exponentialRampToValueAtTime(Math.max(900, f * 3), t + 1.5);
      pf.connect(env);
      var base = 7 * Math.pow(2, -(midi - 48) / 22);
      var inh = 0.00012 * Math.pow(2, (midi - 48) / 14);
      var nPart = midi < 60 ? 8 : midi < 80 ? 6 : 4;
      if (lite) nPart = Math.min(nPart, 5);
      var addPartial = function (freq, amp, dec) {
        var o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
        var g = ctx.createGain();
        g.gain.setValueAtTime(amp, t);
        g.gain.exponentialRampToValueAtTime(amp * 0.4, t + Math.min(0.5, dec * 0.12));
        g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
        o.connect(g); g.connect(pf); o.start(t); o.stop(t + dec + 0.1);
        oscs.push(o);
      };
      for (var p = 1; p <= nPart; p++) {
        var pfreq = f * p * Math.sqrt(1 + inh * p * p);
        if (pfreq > 12000) break;
        var pamp = 0.9 / Math.pow(p, 1.15);
        var pdec = base / (1 + 0.55 * (p - 1));
        if (p <= 2) { addPartial(pfreq * 0.9996, pamp * 0.55, pdec); addPartial(pfreq * 1.0004, pamp * 0.55, pdec * 0.92); }
        else addPartial(pfreq, pamp * 0.7, pdec);
      }
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(0.3 * vol, t + 0.012);
      tau = 0.12;
    } else {
      [[1, 0.8, 'triangle'], [2, 0.25, 'sine'], [3, 0.08, 'sine']].forEach(function (d) {
        var o = ctx.createOscillator(); o.type = d[2]; o.frequency.value = f * d[0];
        var g = ctx.createGain(); g.gain.value = d[1];
        o.connect(g); g.connect(env); o.start(t); oscs.push(o);
      });
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(0.7 * vol, t + 0.015);
      env.gain.exponentialRampToValueAtTime(0.25, t + 0.6);
      env.gain.exponentialRampToValueAtTime(0.04, t + 4);
      tau = 0.12;
    }
    return {
      stop: function () {
        var now = ctx.currentTime;
        var rt = Math.max(tau, 0.06);
        rel.gain.setTargetAtTime(0, now, rt);
        var endAt = Math.max(now, t) + rt * 12 + 0.1;
        oscs.forEach(function (o) { try { o.stop(endAt); } catch (e) {} });
        oscs[0].onended = function () { try { rel.disconnect(); } catch (e) {} };
      }
    };
  }

  /* ---------- pressing ---------- */
  var voices = {};
  var counts = {};
  function mark(key, on) {
    counts[key] = (counts[key] || 0) + (on ? 1 : -1);
    var sel = key.charAt(0) === 'c' ? '[data-chord="' + key.slice(1) + '"]' : '[data-idx="' + key.slice(1) + '"]';
    var els = stage.querySelectorAll('.key' + sel);
    for (var i = 0; i < els.length; i++) els[i].classList.toggle('down', counts[key] > 0);
  }
  function press(id, idx, ahead) {
    if (ahead == null) ahead = 0.05; // taps and clicks: more room for a clean start
    if (voices[id] || !notes[idx]) return;
    if (!ensureCtx()) return;
    voices[id] = { key: 'n' + idx, vs: [startVoice(notes[idx].midi, ahead, 1, false)] };
    mark('n' + idx, true);
  }
  function pressChord(id, n, ahead) {
    if (ahead == null) ahead = 0.05;
    if (voices[id] || n < 0 || n > 7) return;
    if (!ensureCtx()) return;
    var vs = chordInfo(n).idx.map(function (i) { return startVoice(notes[i].midi, ahead, 0.6, true); });
    voices[id] = { key: 'c' + n, vs: vs };
    mark('c' + n, true);
  }
  function pressEl(id, b, ahead) {
    if (b.dataset.chord !== undefined) pressChord(id, Number(b.dataset.chord), ahead == null ? undefined : ahead + 0.013);
    else press(id, Number(b.dataset.idx), ahead);
  }
  function release(id) {
    var o = voices[id];
    if (!o) return;
    o.vs.forEach(function (v) { v.stop(); });
    delete voices[id];
    mark(o.key, false);
  }
  function stopAll() {
    Object.keys(voices).forEach(release);
    counts = {};
  }

  stage.addEventListener('pointerdown', function (e) {
    var b = e.target.closest ? e.target.closest('.key') : null;
    if (!b) return;
    if (S.layout === 'stack' || b.dataset.chord !== undefined) e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (err) {}
    pressEl('p' + e.pointerId, b);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (type) {
    stage.addEventListener(type, function (e) { release('p' + e.pointerId); });
  });
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function typing(el) { return el && (el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA'); }
  window.addEventListener('keydown', function (e) {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey || typing(e.target)) return;
    if (CODE2CHORD.hasOwnProperty(e.code)) { e.preventDefault(); pressChord('k' + e.code, CODE2CHORD[e.code], 0.025); }
    else if (CODE2IDX.hasOwnProperty(e.code)) { e.preventDefault(); press('k' + e.code, CODE2IDX[e.code], 0.012); }
    else if ((e.code === 'Space' || e.code === 'Enter') && e.target.classList && e.target.classList.contains('key')) {
      e.preventDefault(); pressEl('k' + e.code, e.target, 0.012);
    }
  });
  window.addEventListener('keyup', function (e) { release('k' + e.code); });
  window.addEventListener('blur', stopAll);
  document.addEventListener('visibilitychange', function () { if (document.hidden) stopAll(); });

  /* ---------- controls ---------- */
  keySel.addEventListener('change', function () { S.key = Number(keySel.value); save(); render(); keySel.blur(); });
  document.getElementById('layStack').addEventListener('click', function () { S.layout = 'stack'; save(); render(); });
  document.getElementById('layLine').addEventListener('click', function () { S.layout = 'line'; save(); render(); });

  buildOptions();
  render();
})();
</script>

</body>
</html>
